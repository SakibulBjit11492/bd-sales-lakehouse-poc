# Databricks Asset Bundle: the daily pipeline as code.
#   databricks bundle validate   # check this file
#   databricks bundle deploy     # upload notebooks + create/update the job
#   databricks bundle run bd_sales_daily
bundle:
  name: bd_sales_poc

resources:
  jobs:
    bd_sales_daily:
      name: bd_sales_daily
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"   # 07:00 every day
        timezone_id: Asia/Dhaka
        pause_status: PAUSED                    # switch to UNPAUSED when ready
      tasks:                                    # no cluster defined -> serverless compute
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ./notebooks/03_gold.sql
        - task_key: validation
          depends_on: [{ task_key: gold }]
          notebook_task:
            notebook_path: ./notebooks/04_validation.py

targets:
  poc:
    default: true
    workspace:
      host: https://dbc-911a8192-2085.cloud.databricks.com
